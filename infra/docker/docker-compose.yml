name: proofhire

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proofhire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proofhire}
      POSTGRES_DB: ${POSTGRES_DB:-proofhire}
    ports:
      - "5432:5432"
    volumes:
      - proofhire_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proofhire}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - proofhire_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  proofhire_postgres_data:
  proofhire_redis_data:
