name: Dependency and secret checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pip-audit -e packages/contracts -e packages/prompts -e packages/evals -e apps/api -e apps/worker
      - run: pip-audit --skip-editable
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependency scanning (above) only covers what our manifests declare. The
  # container also ships an OS userland — a base image with a critical libc or
  # openssl CVE would pass npm audit and pip-audit cleanly while still being
  # the thing an attacker actually reaches.
  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/Dockerfile.api
          - name: web
            dockerfile: infra/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image
        run: docker build -f ${{ matrix.dockerfile }} -t proofhire-${{ matrix.name }}:scan .
      - name: Scan ${{ matrix.name }} image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: proofhire-${{ matrix.name }}:scan
          format: json
          output: trivy-${{ matrix.name }}.json
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
      # The table renderer truncates the file path, which is the one field that
      # tells you whether a finding is in your code, a base-image toolchain, or
      # something a build step dragged in. Print path + fix per finding, then
      # fail if there were any.
      - name: Report findings with paths
        run: |
          jq -r '
            [.Results[]? | .Target as $t | (.Vulnerabilities // [])[] | {t: $t, p: (.PkgPath // ""), id: .VulnerabilityID, s: .Severity, pkg: .PkgName, v: .InstalledVersion, fix: .FixedVersion}]
            | if length == 0 then "No CRITICAL/HIGH findings" else
                (.[] | "\(.s)	\(.pkg) \(.v) -> \(.fix)	\(.id)	\(if .p != "" then .p else .t end)"),
                "
\(length) finding(s)"
              end
          ' trivy-${{ matrix.name }}.json
          count=$(jq '[.Results[]? | (.Vulnerabilities // [])[]] | length' trivy-${{ matrix.name }}.json)
          test "$count" -eq 0
