[project]
name = "proofhire-evals"
version = "0.1.0"
description = "Evaluation dataset schema + metrics harness (PRD §26)"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proofhire_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
