[project]
name = "proofhire-api"
version = "0.1.0"
description = "ProofHire FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pgvector>=0.3",
    "python-json-logger>=2.0",
    "authlib>=1.3",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    "httpx>=0.27",
    "bcrypt>=4.2",
    "pydantic[email]>=2.9",
    "sse-starlette>=2.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    "proofhire-contracts",
    "proofhire-worker",
]

[tool.uv.sources]
proofhire-contracts = { path = "../../packages/contracts", editable = true }
# The API enqueues tasks (e.g. sync_repositories) defined in the worker package.
# This mutual api<->worker path dependency is a deliberate modular-monolith
# tradeoff (ADR-0001) — both deploy from one repo, so it's simpler than
# duplicating task signatures or introducing a third shared package for them.
proofhire-worker = { path = "../worker", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "aiosqlite>=0.20",
    "pytest-asyncio>=0.24",
    "pytest-postgresql>=6.1",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests that hit the real DB reuse proofhire_api.db's module-level async engine
# (and its connection pool), which is bound to whichever event loop first used
# it. Function-scoped loops (pytest-asyncio's default) break pooled connections
# across tests; session-scoped loops keep one loop for the whole run instead.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proofhire_api"]

