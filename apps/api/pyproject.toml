[project]
name = "proofhire-api"
version = "0.1.0"
description = "ProofHire FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pgvector>=0.3",
    "python-json-logger>=2.0",
    "authlib>=1.3",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    "httpx>=0.27",
    "bcrypt>=4.2",
    "pydantic[email]>=2.9",
    "proofhire-contracts",
]

[tool.uv.sources]
proofhire-contracts = { path = "../../packages/contracts", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-postgresql>=6.1",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
