[project]
name = "proofhire-worker"
version = "0.1.0"
description = "ProofHire async ingestion/AI/render workers"
requires-python = ">=3.13"
dependencies = [
    "dramatiq[redis]>=1.17",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-json-logger>=2.0",
    "httpx>=0.27",
    "cryptography>=43.0",
    "openai>=1.54",
    "anthropic>=0.39",
    "proofhire-contracts",
    "proofhire-api",
    "proofhire-prompts",
]

[tool.uv.sources]
proofhire-contracts = { path = "../../packages/contracts", editable = true }
proofhire-prompts = { path = "../../packages/prompts", editable = true }
# Ingestion tasks (Agent-1-owned territory per PRD §34) use the API's SQLAlchemy
# models/db session directly, since they're data-plane work in the same schema —
# see docs/adr/0001-architecture.md. Only worker/intelligence (Phase 2+) must go
# through repository Protocol interfaces instead of importing SQLAlchemy (PRD §35).
proofhire-api = { path = "../api", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Tests that hit the real DB (test_generation_pipeline.py etc.) reuse
# proofhire_api.db's module-level async engine/connection pool, bound to
# whichever event loop first used it — function-scoped loops (the default)
# break pooled connections across tests. See apps/api/pyproject.toml, which
# needed the same fix first.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proofhire_worker"]
